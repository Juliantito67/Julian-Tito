<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PAC-MAN WIKI | ARCADE HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #FFE68F, #FFD966);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'VT323', monospace;
            padding-top: 0;
        }
        .arcade-header {
            background: #E31C23;
            border-bottom: 4px solid #8B2A1A;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 0.3rem 2rem;
        }
        .header-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .title-area {
            flex-shrink: 0;
        }
        .title-area h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: #FFD966;
            text-shadow: 3px 3px 0 #6B1A0A;
            white-space: nowrap;
        }
        .title-area p {
            font-family: 'VT323', monospace;
            font-size: 0.7rem;
            color: #FFF2BB;
            white-space: nowrap;
        }
        .header2-buttons {
            display: flex;
            gap: 0.6rem;
            background: #a51f1aaa;
            padding: 0.3rem 0.8rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: -8px;
            pointer-events: none;
        }
        .header2-btn {
            background: #FFD966;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            padding: 0.4rem 0.6rem;
            color: #A1220F;
            border-radius: 40px;
            letter-spacing: 1px;
            font-weight: bold;
            box-shadow: 0 3px 0 #8B2A1A;
            text-align: center;
            min-width: 65px;
            transition: all 0.2s ease;
            cursor: default;
        }
        .header2-btn[data-page="play"] {
            background: #8B0000;
            color: #FFD966;
            box-shadow: 0 3px 0 #4A0000;
            animation: pulsePlayButton 1.2s ease-in-out infinite;
            transform-origin: center;
        }
        @keyframes pulsePlayButton {
            0% { transform: scale(1); background: #8B0000; box-shadow: 0 3px 0 #4A0000; }
            50% { transform: scale(1.08); background: #B22222; box-shadow: 0 4px 0 #5A1010; }
            100% { transform: scale(1); background: #8B0000; box-shadow: 0 3px 0 #4A0000; }
        }
        .header2-btn.active-page-indicator {
            background: #3A86FF !important;
            color: white !important;
            transform: scale(1.02);
            box-shadow: 0 0 8px #88AAFF, 0 3px 0 #1A3A8A;
            animation: none !important;
        }
        .joystick-card {
            background: #000000;
            padding: 0.4rem 1rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            border-top: 2px solid #FFC857;
            border-bottom: 2px solid #FFC857;
            width: 100%;
            min-height: 130px;
            margin-top: 20px;
        }
        .left-group {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: transparent;
            padding: 0.6rem 1.8rem;
            transform: translateX(-40px);
        }
        .left-group::before {
            content: '';
            position: absolute;
            top: 0px;
            left: -25px;
            right: -25px;
            bottom: 0px;
            border: 4px dotted #FFD966;
            pointer-events: none;
            z-index: 1;
        }
        .left-corner-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #FFD966;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        .left-corner-tl { top: -4px; left: -29px; }
        .left-corner-tr { top: -4px; right: -22px; }
        .left-corner-bl { bottom: -4px; left: -29px; }
        .left-corner-br { bottom: -4px; right: -22px; }
        .right-group {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            background: transparent;
            padding: 1rem 1.2rem;
            transform: translateX(40px);
        }
        .right-group::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -25px;
            right: -25px;
            bottom: -40px;
            border: 4px dotted #FFD966;
            pointer-events: none;
            z-index: 1;
        }
        .right-corner-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #FFD966;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        .right-corner-tl { top: -44px; left: -29px; }
        .right-corner-tr { top: -44px; right: -22px; }
        .right-corner-bl { bottom: -44px; left: -29px; }
        .right-corner-br { bottom: -44px; right: -22px; }
        .right-buttons-container {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            transform: translateY(0px);
        }
        .left-buttons-container {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        .buttons-1-2-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            transform: translateX(-35px);
        }
        .button-1-up { transform: translateY(-8px); }
        .button-1-label {
            margin-top: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            color: #FF3333;
            text-align: center;
        }
        .button-2-up { transform: translateY(-4px); }
        .button-3-up { transform: translateY(-24px); }
        .left-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .left-backing-white {
            width: 52px;
            height: 52px;
            background: #A0A0B0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px #C0C0D0, 0 3px 5px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
        }
        .left-backing-dark-yellow {
            width: 52px;
            height: 52px;
            background: #D4A017;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px #B8860B, 0 3px 5px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
        }
        .left-arcade-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: 0.05s linear;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.4);
            border: none;
            position: relative;
            cursor: pointer;
        }
        .left-arcade-btn:active { transform: scale(0.88); }
        .btn-left-white { background: #FFFFFF; }
        .btn-left-yellow { background: #FFD700; }
        .joystick-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            transform: translateY(2px);
        }
        .switches-container {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            justify-content: center;
        }
        .electrical-switch {
            width: 46px;
            height: 26px;
            background: #FFFFFF;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.8);
            cursor: pointer;
            position: relative;
        }
        .electrical-switch::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 22px;
            background: #E0E0E0;
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .electrical-switch.active::before { transform: translateX(22px); background: #CCCCCC; }
        .stick-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
        }
        .double-border-gap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            pointer-events: none;
        }
        .inner-border {
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border: 2.5px solid #3A86FF;
        }
        .outer-border {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2.5px solid #3A86FF;
        }
        .move-label {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.45rem;
            color: #3A86FF;
            background: #000000;
            padding: 2px 6px;
            border-radius: 20px;
            white-space: nowrap;
            z-index: 15;
        }
        .joystick-base {
            width: 58px;
            height: 58px;
            background: #3A3A3A;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 0 3px #2A2A2A, 0 5px 8px rgba(0,0,0,0.4);
            cursor: grab;
            z-index: 5;
        }
        .triangle-up, .triangle-down, .triangle-left, .triangle-right {
            position: absolute;
            width: 0;
            height: 0;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
            z-index: 1;
        }
        .triangle-up { top: -12px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 18px solid #8B0000; }
        .triangle-down { bottom: -12px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 18px solid #8B0000; }
        .triangle-left { left: -12px; top: 50%; transform: translateY(-50%); border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 18px solid #8B0000; }
        .triangle-right { right: -12px; top: 50%; transform: translateY(-50%); border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 18px solid #8B0000; }
        .joystick-handle {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 35% 35%, #8B0000, #4A0000);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.03s linear;
            box-shadow: 0 6px 12px black, inset 0 2px 3px rgba(255,255,255,0.3);
            cursor: grab;
            border: 1px solid #AA3333;
            z-index: 6;
        }
        .right-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .right-backing-white {
            width: 52px;
            height: 52px;
            background: #A0A0B0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px #C0C0D0, 0 3px 5px rgba(0,0,0,0.4);
        }
        .right-backing-red {
            width: 52px;
            height: 52px;
            background: #8B1A1A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px #5A0A0A, 0 3px 5px rgba(0,0,0,0.4);
        }
        .right-arcade-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: 0.05s linear;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            border: none;
            position: relative;
            cursor: pointer;
        }
        .right-arcade-btn:active { transform: scale(0.88); }
        .btn-right-red { background: #CC2222; }
        .btn-right-white { background: #FFFFFF; }
        .status-panel {
            margin-top: 0.3rem;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            color: #FFFFFF;
            background: #000000aa;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
        }
        .wiki-container {
            max-width: 1300px;
            margin: 250px auto 2rem auto;
            padding: 0 20px 30px;
            background: #FFF7E0;
            border: 6px solid #E31C23;
            border-radius: 48px;
            width: 100%;
        }
        .page { display: none; animation: fadeIn 0.25s ease; padding: 1.5rem; }
        .active-page { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .section-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: #C42414;
            border-left: 10px solid #E31C23;
            padding-left: 20px;
            margin: 1.5rem 0 1rem;
        }
        .arcade-text {
            font-family: 'VT323', monospace;
            font-size: 1.7rem;
            line-height: 1.45;
            color: #2A2418;
            margin-bottom: 1rem;
        }
        .info-card {
            background: #FEF0C0;
            border-radius: 28px;
            padding: 1.2rem 2rem;
            margin: 1.5rem 0;
            border-left: 12px solid #E31C23;
        }
        .grid-2col { display: flex; flex-wrap: wrap; gap: 2rem; margin: 1.5rem 0; }
        .grid-item { flex: 1; min-width: 260px; background: #FFF2CF; border-radius: 28px; padding: 1.2rem; border: 2px solid #E31C23; }
        .badge {
            background: #E31C23;
            color: #FFE484;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 10px 0;
        }
        .tip-section {
            margin-top: 2rem;
            background: #1E2F3F;
            border-radius: 28px;
            padding: 1.2rem 2rem;
            color: #FFE484;
            border: 2px solid #FFB347;
        }
        .empty-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            color: #A0A0A0;
            text-align: center;
        }
        .character-viewer {
            background: #1E1B10;
            border-radius: 48px;
            padding: 2rem;
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid #E31C23;
            box-shadow: 0 0 0 4px #FFD966, 0 10px 25px black;
        }
        .char-description {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: #FFD966;
            text-align: center;
            margin-bottom: 1rem;
            background: #000000aa;
            padding: 0.5rem 1rem;
            border-radius: 30px;
        }
        .char-box {
            background: #2A2418;
            border-radius: 48px;
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
        }
        .char-shape-canvas {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0C0A06;
            border-radius: 40px;
            margin-bottom: 0.8rem;
            box-shadow: inset 0 0 0 3px #FFC857, 0 8px 20px black;
        }
        canvas.geo-canvas {
            width: 170px;
            height: 170px;
            background: #11100C;
            border-radius: 32px;
            box-shadow: 0 0 0 2px #D4AF37;
        }
        .char-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            margin-top: 0.6rem;
            color: #FFD966;
            background: #E31C23;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            text-align: center;
        }
        .char-description-text {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            margin-top: 0.8rem;
            color: #FFF7E0;
            text-align: center;
            background: #00000099;
            padding: 6px 12px;
            border-radius: 24px;
        }
        .char-hint {
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
            margin-top: 1rem;
            color: #FFB347;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 1.2rem;
            border-top: 2px dashed #E31C23;
            padding-top: 1rem;
            color: #6A2E1A;
        }
        @media (max-width: 860px) {
            .header-top { flex-direction: column; align-items: center; }
            .title-area h1, .title-area p { white-space: normal; text-align: center; }
            .header2-buttons { justify-content: center; margin-top: 0; }
            .wiki-container { margin-top: 320px; }
            .joystick-card { margin-top: 50px; }
        }
    </style>
</head>
<body>
    <div class="arcade-header">
        <div class="header-top">
            <div class="title-area">
                <h1>PAC-MAN WIKI</h1>
                <p>👾 THE DEFINITIVE ARCADE DATABASE</p>
            </div>
            <div id="header2Buttons" class="header2-buttons">
                <div class="header2-btn" data-page="home">HOME</div>
                <div class="header2-btn" data-page="creator">CREATOR</div>
                <div class="header2-btn" data-page="characters">CHARACTERS</div>
                <div class="header2-btn" data-page="howto">HOW TO PLAY</div>
                <div class="header2-btn" data-page="play">PLAY</div>
            </div>
        </div>
        <div class="joystick-card">
            <div class="left-group">
                <div class="left-corner-dot left-corner-tl"></div><div class="left-corner-dot left-corner-tr"></div>
                <div class="left-corner-dot left-corner-bl"></div><div class="left-corner-dot left-corner-br"></div>
                <div class="left-buttons-container">
                    <div class="buttons-1-2-wrapper">
                        <div class="left-btn-container button-1-up" data-nav="home">
                            <div class="left-backing-white"><div class="left-arcade-btn btn-left-white"></div></div>
                            <div class="button-1-label">HOME</div>
                        </div>
                        <div class="left-btn-container button-2-up" data-nav="play">
                            <div class="left-backing-white"><div class="left-arcade-btn btn-left-white"></div></div>
                        </div>
                    </div>
                    <div class="left-btn-container button-3-up" id="cycleCharacterBtnContainer">
                        <div class="left-backing-dark-yellow"><div class="left-arcade-btn btn-left-yellow"></div></div>
                    </div>
                </div>
            </div>
            <div class="joystick-area">
                <div class="switches-container"><div class="electrical-switch" id="electricalSwitch1"></div><div class="electrical-switch" id="electricalSwitch2"></div></div>
                <div class="stick-wrapper"><div id="joystickBase" class="joystick-base"><div class="triangle-up"></div><div class="triangle-down"></div><div class="triangle-left"></div><div class="triangle-right"></div><div id="joystickHandle" class="joystick-handle"></div></div><div class="double-border-gap"><div class="inner-border"></div><div class="outer-border"></div><div class="move-label">MOVE</div></div></div>
            </div>
            <div class="right-group">
                <div class="right-corner-dot right-corner-tl"></div><div class="right-corner-dot right-corner-tr"></div>
                <div class="right-corner-dot right-corner-bl"></div><div class="right-corner-dot right-corner-br"></div>
                <div class="right-buttons-container">
                    <div class="right-btn-container" data-nav="creator"><div class="right-backing-red"><div class="right-arcade-btn btn-right-red"></div></div></div>
                    <div class="right-btn-container" data-nav="characters"><div class="right-backing-white"><div class="right-arcade-btn btn-right-white"></div></div></div>
                    <div class="right-btn-container" data-nav="howto"><div class="right-backing-white"><div class="right-arcade-btn btn-right-white"></div></div></div>
                </div>
            </div>
        </div>
        <div class="status-panel" id="directionStatus">🎮 USE THE BUTTONS ABOVE TO NAVIGATE</div>
    </div>
    <div class="wiki-container">
        <div id="home-page" class="page active-page"></div>
        <div id="creator-page" class="page"></div>
        <div id="characters-page" class="page"></div>
        <div id="howto-page" class="page"></div>
        <div id="play-page" class="page"></div>
    </div>

    <script>
        // ========================
        // PAC-MAN & GHOST DRAWING
        // ========================
        function drawPacMan(ctx, w, h) {
            const cx = w/2, cy = h/2, rad = w * 0.42;
            ctx.clearRect(0, 0, w, h);
            ctx.beginPath();
            ctx.arc(cx, cy, rad, 0.25 * Math.PI, 1.75 * Math.PI);
            ctx.lineTo(cx, cy);
            ctx.fillStyle = "#FFD966";
            ctx.fill();
            ctx.strokeStyle = "#B8860B";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = "#1A1A1A";
            ctx.beginPath();
            ctx.moveTo(cx+8, cy-6);
            ctx.lineTo(cx+32, cy-18);
            ctx.lineTo(cx+28, cy+4);
            ctx.fill();
        }
        
        function drawGhost(ctx, w, h, bodyColor, pupilColor) {
            const cx = w/2;
            const topY = h * 0.24;
            const bottomY = h * 0.72;
            const bodyW = w * 0.56;
            const leftX = cx - bodyW/2;
            ctx.clearRect(0, 0, w, h);
            ctx.beginPath();
            ctx.ellipse(cx, topY + (bodyW/2)*0.32, bodyW/2, bodyW*0.4, 0, 0, Math.PI*2);
            ctx.fillStyle = bodyColor;
            ctx.fill();
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.roundRect(leftX, topY + 14, bodyW, bottomY - topY - 14, 20);
            ctx.fill();
            const eyeY = topY + 32;
            const leftEyeX = cx - w*0.15;
            const rightEyeX = cx + w*0.15;
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.ellipse(leftEyeX, eyeY, 27, 29, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(rightEyeX, eyeY, 27, 29, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = pupilColor;
            ctx.beginPath();
            ctx.arc(leftEyeX + 8, eyeY + 2, 17, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(rightEyeX + 8, eyeY + 2, 17, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(leftEyeX + 3, eyeY - 5, 6, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(rightEyeX + 3, eyeY - 5, 6, 0, 2*Math.PI);
            ctx.fill();
        }
        
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }
        
        // ========================
        // CHARACTER DATA
        // ========================
        const characters = [
            { name: "PAC-MAN", draw: (ctx, w, h) => drawPacMan(ctx, w, h), description: "The hungry yellow hero. Eats dots and avoids ghosts. No eyes — pure instinct." },
            { name: "BLINKY", draw: (ctx, w, h) => drawGhost(ctx, w, h, "#E34234", "#3A86FF"), description: "The red ghost. Relentless chaser. Speeds up when dots are few." },
            { name: "PINKY", draw: (ctx, w, h) => drawGhost(ctx, w, h, "#FF99CC", "#3A86FF"), description: "The pink ghost. Ambush predator. Tries to cut you off ahead." },
            { name: "INKY", draw: (ctx, w, h) => drawGhost(ctx, w, h, "#3EC1D3", "#3A86FF"), description: "The cyan ghost. Unpredictable flanker. Uses complex teamwork AI." },
            { name: "CLYDE", draw: (ctx, w, h) => drawGhost(ctx, w, h, "#FFA559", "#3A86FF"), description: "The orange ghost. Roamer and retreat. Acts randomly when close." }
        ];
        
        let currentIdx = 0;
        let activePageId = 'home';
        let canvasRef = null, ctxRef = null;
        
        function renderCurrent() {
            if (!ctxRef || !canvasRef) return;
            const w = canvasRef.width, h = canvasRef.height;
            characters[currentIdx].draw(ctxRef, w, h);
        }
        
        function updateCharacterUI() {
            if (!canvasRef) return;
            renderCurrent();
            const nameSpan = document.getElementById('charNameGeo');
            const descSpan = document.getElementById('charDescGeo');
            if (nameSpan) nameSpan.innerText = characters[currentIdx].name;
            if (descSpan) descSpan.innerText = characters[currentIdx].description;
            const yellowBtn = document.querySelector('#cycleCharacterBtnContainer .left-arcade-btn');
            if (yellowBtn) { yellowBtn.style.transform = 'scale(0.86)'; setTimeout(() => { if(yellowBtn) yellowBtn.style.transform = ''; }, 120); }
        }
        
        function cycleCharacter() {
            currentIdx = (currentIdx + 1) % characters.length;
            if (activePageId === 'characters' && ctxRef) {
                updateCharacterUI();
            }
        }
        
        // ========================
        // PAGE CONTENT BUILDER (no iframe, just static wiki)
        // ========================
        function buildFullPages() {
            document.getElementById('home-page').innerHTML = `<div class="section-title">WELCOME!!</div><div class="arcade-text">To the Ultimate Pac-Man Wiki!</div><div class="info-card"><div class="arcade-text">To navigate or even play a page, use the buttons above and discover which button leads to which page.<br><br>Enjoy our website and have fun!!</div></div><div class="tip-section"><div class="badge">🎮 TIP</div><div class="arcade-text">Click the PLAY button (red pulsing arcade button) to launch the game → play.html</div></div><footer>PAC-MAN - NAMCO 1980 - ETERNAL LEGEND</footer>`;
            
            document.getElementById('creator-page').innerHTML = `<div class="section-title">TORU IWATANI - MASTER MIND</div><div style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; margin: 1rem 0;"><img id="toruImg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Toru_Iwatani_2011.jpg/440px-Toru_Iwatani_2011.webp" alt="Toru Iwatani" style="width: 220px; border-radius: 28px; border: 5px solid #E31C23; background: white;"><div><div style="font-family:'Press Start 2P'; font-size:1.4rem; color:#A1220F;">TORU IWATANI</div><div style="font-family:'Press Start 2P'; font-size:1rem; background:#E31C23; color:#FFE484; display:inline-block; padding:8px 18px; border-radius:40px; margin:12px 0;">BORN: JAN 25, 1955  |  ALIVE AND LEGENDARY</div><div class="arcade-text">Japanese game designer, creator of Pac-Man (1980). Designed to move away from violent shooters. Philosophy: a game about eating, not killing.</div></div></div><footer>"Design games that make people smile" - Toru Iwatani</footer>`;
            
            document.getElementById('characters-page').innerHTML = `<div class="section-title">MAZE HUNTERS AND GHOST SQUAD</div><div class="character-viewer"><div class="char-description" id="charDescGeo">Click the YELLOW button (3) to cycle characters</div><div class="char-box"><div class="char-shape-canvas"><canvas id="geoCanvasRedesign" class="geo-canvas" width="300" height="300" style="width:175px; height:175px"></canvas></div><div id="charNameGeo" class="char-name">PAC-MAN</div><div id="charDescGeo" class="char-description-text">The hungry yellow hero. Eats dots and avoids ghosts. No eyes — pure instinct.</div></div><div class="char-hint">🟡 PRESS THE YELLOW BUTTON (3) TO SEE THE NEXT CHARACTER 🟡</div></div><div class="info-card" style="text-align:center;"><div class="arcade-text">Each ghost has a unique AI personality. Blinky chases, Pinky ambushes, Inky flanks, Clyde roams.</div></div><footer>Classic ghost AI: unpredictable and iconic</footer>`;
            
            document.getElementById('howto-page').innerHTML = `<div class="section-title">ARCADE INSTRUCTIONS</div><div class="grid-2col"><div class="grid-item"><div class="badge">OBJECTIVE</div><div class="arcade-text">Eat all dots while avoiding ghosts.</div></div><div class="grid-item"><div class="badge">CONTROLS</div><div class="arcade-text">Arcade buttons or joystick - navigate pages</div></div><div class="grid-item"><div class="badge">POWER PELLETS</div><div class="arcade-text">Four flashing dots, ghosts turn blue and flee.</div></div><div class="grid-item"><div class="badge">FRUIT BONUSES</div><div class="arcade-text">Cherry, Strawberry, Orange, Apple</div></div></div><div class="tip-section"><div class="badge" style="background:#FFB347;">GHOST BEHAVIOR DEEP DIVE</div><div class="arcade-text">Blinky: Direct chase. Pinky: Ambush ahead. Inky: Complex flanking. Clyde: Random when close.</div></div><footer>Master patterns and turn the tables on ghosts</footer>`;
            
            // Play page: simple message with redirect info (actual redirect happens when page becomes active)
            document.getElementById('play-page').innerHTML = `<div class="empty-page"><div>🕹️ REDIRECTING TO GAME...<br>WAIT OR CLICK AGAIN</div></div>`;
        }
        
        const pages = {
            home: document.getElementById('home-page'),
            creator: document.getElementById('creator-page'),
            characters: document.getElementById('characters-page'),
            howto: document.getElementById('howto-page'),
            play: document.getElementById('play-page')
        };
        
        // REDIRECT FUNCTION: navigates to play.html when Play page is activated
        function redirectToPlayGame() {
            // Use window.location to go to play.html (same directory)
            window.location.href = 'play.html';
        }
        
        function switchToPage(pageId) {
            if (activePageId === pageId) return;
            
            // SPECIAL BEHAVIOR: if target page is "play", we redirect immediately!
            if (pageId === 'play') {
                redirectToPlayGame();
                return; // Stop further execution - page will change via redirect
            }
            
            Object.values(pages).forEach(p => p.classList.remove('active-page'));
            pages[pageId].classList.add('active-page');
            activePageId = pageId;
            
            document.querySelectorAll('.header2-btn').forEach(btn => {
                if(btn.getAttribute('data-page') === pageId) btn.classList.add('active-page-indicator');
                else btn.classList.remove('active-page-indicator');
            });
            
            if (pageId === 'characters') {
                setTimeout(() => {
                    canvasRef = document.getElementById('geoCanvasRedesign');
                    if (canvasRef) {
                        ctxRef = canvasRef.getContext('2d');
                        canvasRef.width = 300;
                        canvasRef.height = 300;
                        renderCurrent();
                        const nSpan = document.getElementById('charNameGeo');
                        const dSpan = document.getElementById('charDescGeo');
                        if (nSpan) nSpan.innerText = characters[currentIdx].name;
                        if (dSpan) dSpan.innerText = characters[currentIdx].description;
                    }
                }, 30);
            }
        }
        
        buildFullPages();
        
        // ========================
        // ARCADE BUTTON EVENT HANDLERS
        // ========================
        // HOME button (top left white)
        document.querySelector('.left-btn-container[data-nav="home"]')?.addEventListener('click', () => switchToPage('home'));
        // PLAY button (second white button, below HOME) -> now triggers REDIRECT
        document.querySelector('.left-btn-container[data-nav="play"]')?.addEventListener('click', () => switchToPage('play'));
        // Right side buttons
        document.querySelector('.right-btn-container[data-nav="creator"]')?.addEventListener('click', () => switchToPage('creator'));
        document.querySelector('.right-btn-container[data-nav="characters"]')?.addEventListener('click', () => switchToPage('characters'));
        document.querySelector('.right-btn-container[data-nav="howto"]')?.addEventListener('click', () => switchToPage('howto'));
        
        // Yellow button cycle character
        const cycleBtn = document.getElementById('cycleCharacterBtnContainer');
        if (cycleBtn) {
            cycleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                cycleCharacter();
                if (activePageId === 'characters' && canvasRef) {
                    updateCharacterUI();
                }
            });
        }
        
        // Electrical switches (toggle visual)
        document.getElementById('electricalSwitch1')?.addEventListener('click', function() { this.classList.toggle('active'); });
        document.getElementById('electricalSwitch2')?.addEventListener('click', function() { this.classList.toggle('active'); });
        
        // ========================
        // JOYSTICK - VISUAL ONLY (no navigation, just animation)
        // ========================
        const joyBase = document.getElementById('joystickBase');
        const joyHandle = document.getElementById('joystickHandle');
        let dragActive = false;
        const LIMIT = 26;
        
        function getVector(cx, cy) {
            const rect = joyBase.getBoundingClientRect();
            const dx = cx - (rect.left + rect.width/2);
            const dy = cy - (rect.top + rect.height/2);
            const dist = Math.min(LIMIT, Math.hypot(dx, dy));
            if (dist < 6) return { x: 0, y: 0, active: false };
            const ang = Math.atan2(dy, dx);
            return { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, active: true };
        }
        
        function updateStick(cx, cy) {
            if (!dragActive) return;
            const off = getVector(cx, cy);
            if (off.active) {
                joyHandle.style.transform = `translate(calc(-50% + ${off.x}px), calc(-50% + ${off.y}px))`;
                let dir = "CENTER";
                if (Math.abs(off.x) > 8 || Math.abs(off.y) > 8) {
                    if (Math.abs(off.x) > Math.abs(off.y)) dir = off.x > 0 ? "RIGHT" : "LEFT";
                    else dir = off.y > 0 ? "DOWN" : "UP";
                }
                document.getElementById('directionStatus').innerText = `🎮 STICK: ${dir} (visual only)`;
            } else {
                joyHandle.style.transform = `translate(-50%, -50%)`;
                document.getElementById('directionStatus').innerText = `🎮 CLICK PLAY BUTTON → REDIRECT TO play.html`;
            }
        }
        
        function onStart(e) {
            dragActive = true;
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; e.preventDefault(); }
            else { cx = e.clientX; cy = e.clientY; }
            updateStick(cx, cy);
        }
        
        function onMove(e) {
            if (!dragActive) return;
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; e.preventDefault(); }
            else { cx = e.clientX; cy = e.clientY; }
            updateStick(cx, cy);
        }
        
        function onEnd() {
            dragActive = false;
            joyHandle.style.transform = `translate(-50%, -50%)`;
            document.getElementById('directionStatus').innerText = `🎮 CLICK PLAY BUTTON → REDIRECT TO play.html`;
        }
        
        if (joyBase) {
            joyBase.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            joyBase.addEventListener('touchstart', onStart);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('touchend', onEnd);
        }
        
        // Start with HOME page visible
        switchToPage('home');
        
        // handle Toru image fallback
        const toruImage = document.getElementById('toruImg');
        if (toruImage) toruImage.onerror = () => toruImage.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Toru_Iwatani_2011.jpg/440px-Toru_Iwatani_2011.jpg";
    </script>
</body>
</html>
